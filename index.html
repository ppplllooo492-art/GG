
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Realtime Mod Hub v6.0</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #070a13 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glow-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glow-card:hover {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
            transform: translateY(-4px);
        }

        .hidden-section {
            display: none !important;
        }

        input, textarea {
            color-scheme: dark;
        }
    </style>
</head>

<body class="p-4 md:p-8 block w-full">

    <!-- Loading -->
    <div id="loadingOverlay"
         class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center gap-4">

        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>

        <p id="loadingText" class="text-sm text-cyan-400 animate-pulse">
            กำลังเชื่อมต่อฐานข้อมูลโกลบอล...
        </p>
    </div>

    <!-- Dashboard -->
    <div id="mainDashboard" class="w-full max-w-7xl mx-auto">

        <header class="text-center my-6 relative">

            <div class="absolute top-0 left-1/2 -translate-x-1/2
                        w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl -z-10">
            </div>

            <h1 class="text-3xl md:text-5xl font-bold tracking-wide
                       bg-gradient-to-r from-cyan-400 via-indigo-400 to-cyan-500
                       bg-clip-text text-transparent mb-2">

                <i class="fa-solid fa-network-wired mr-2 text-cyan-400"></i>
                GLOBAL REALTIME HUB

            </h1>

            <p class="text-gray-400 text-xs md:text-sm">
                แชร์ข้อมูลและอัปเดตไฟล์ร่วมกันผ่านฐานข้อมูลออนไลน์
            </p>

        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-8">

            <!-- Upload Form -->
            <section class="lg:col-span-1">

                <div class="glass-effect p-6 rounded-2xl shadow-2xl sticky top-6">

                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2
                               text-cyan-400 border-b border-gray-800 pb-3">

                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        ส่งข้อมูลเข้าสู่ระบบคลาวด์

                    </h2>

                    <form id="modForm" class="space-y-4">

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                ชื่อผู้แชร์
                            </label>

                            <input type="text"
                                   id="modUploader"
                                   maxlength="50"
                                   required
                                   placeholder="Anonymous"
                                   class="w-full bg-slate-900/60 border border-gray-700
                                          rounded-lg px-3 py-2 text-xs
                                          focus:outline-none focus:border-cyan-500">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                ชื่อ Mod / Application
                            </label>

                            <input type="text"
                                   id="modName"
                                   maxlength="100"
                                   required
                                   placeholder="ชื่อ Mod"
                                   class="w-full bg-slate-900/60 border border-gray-700
                                          rounded-lg px-3 py-2 text-xs
                                          focus:outline-none focus:border-cyan-500">
                        </div>

                        <div class="grid grid-cols-2 gap-2">

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    เกม / มอนสเตอร์
                                </label>

                                <input type="text"
                                       id="modMonster"
                                       maxlength="50"
                                       required
                                       placeholder="เกม"
                                       class="w-full bg-slate-900/60 border border-gray-700
                                              rounded-lg px-3 py-2 text-xs
                                              focus:outline-none focus:border-cyan-500">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    เวอร์ชัน
                                </label>

                                <input type="text"
                                       id="modVersion"
                                       maxlength="30"
                                       required
                                       placeholder="v1.0"
                                       class="w-full bg-slate-900/60 border border-gray-700
                                              rounded-lg px-3 py-2 text-xs
                                              focus:outline-none focus:border-cyan-500">
                            </div>

                        </div>

                        <div>

                            <label class="block text-xs text-gray-400 mb-1">
                                รูปภาพประกอบ
                            </label>

                            <input type="file"
                                   id="modImgFile"
                                   accept="image/jpeg,image/png,image/webp,image/gif"
                                   class="w-full text-xs text-gray-400
                                          bg-slate-900/40 p-1.5 rounded-lg
                                          border border-gray-700 mb-2">

                            <input type="url"
                                   id="modImgUrl"
                                   placeholder="หรือใส่ URL รูปภาพ"
                                   class="w-full bg-slate-900/60 border border-gray-700
                                          rounded-lg px-3 py-2 text-xs
                                          focus:outline-none focus:border-cyan-500">

                            <p class="text-[10px] text-gray-500 mt-1">
                                รูปที่อัปโหลดต้องมีขนาดไม่เกิน 500 KB
                            </p>

                        </div>

                        <div>

                            <label class="block text-xs text-gray-400 mb-1">
                                ลิงก์ดาวน์โหลด
                            </label>

                            <input type="url"
                                   id="modLink"
                                   required
                                   placeholder="https://..."
                                   class="w-full bg-slate-900/60 border border-gray-700
                                          rounded-lg px-3 py-2 text-xs
                                          focus:outline-none focus:border-cyan-500">

                        </div>

                        <div>

                            <label class="block text-xs text-gray-400 mb-1">
                                คำอธิบาย
                            </label>

                            <textarea id="modDesc"
                                      rows="3"
                                      maxlength="1000"
                                      required
                                      placeholder="รายละเอียด..."
                                      class="w-full bg-slate-900/60 border border-gray-700
                                             rounded-lg px-3 py-2 text-xs
                                             focus:outline-none focus:border-cyan-500
                                             resize-none"></textarea>

                        </div>

                        <button id="submitBtn"
                                type="submit"
                                class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600
                                       hover:from-cyan-500 hover:to-indigo-500
                                       text-white font-medium py-2.5 rounded-lg
                                       text-xs transition-all cursor-pointer">

                            <i class="fa-solid fa-satellite-dish"></i>
                            อัปโหลดข้อมูล

                        </button>

                    </form>

                </div>

            </section>

            <!-- Live Database -->
            <section class="lg:col-span-2">

                <div class="flex justify-between items-center mb-4">

                    <h2 class="text-lg font-semibold flex items-center gap-2
                               text-cyan-400">

                        <i class="fa-solid fa-globe text-indigo-400"></i>
                        ฟีดอัปเดตสด

                    </h2>

                    <span id="modCount"
                          class="bg-slate-800 text-xs text-cyan-400 px-3 py-1
                                 rounded-full border border-slate-700">
                        0 รายการ
                    </span>

                </div>

                <div id="modContainer"
                     class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div class="glass-effect p-8 rounded-2xl text-center text-gray-500">
                        กำลังโหลดข้อมูล...
                    </div>

                </div>

            </section>

        </div>

    </div>

    <!-- Firebase Realtime Database -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            push,
            set,
            onValue,
            onDisconnect
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // =========================================
        // 1. ตั้งค่า Firebase
        // =========================================

        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",

            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",

            databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT_ID.appspot.com",

            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

            appId: "YOUR_APP_ID"

        };


        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);


        // =========================================
        // 2. ตัวแปรหลัก
        // =========================================

        const modContainer = document.getElementById("modContainer");

        const modCount = document.getElementById("modCount");

        const loadingOverlay = document.getElementById("loadingOverlay");

        const loadingText = document.getElementById("loadingText");

        const modForm = document.getElementById("modForm");

        const submitBtn = document.getElementById("submitBtn");


        let isConnected = false;


        // =========================================
        // 3. ฟังก์ชัน Escape HTML
        // =========================================

        function escapeHtml(value) {

            return String(value ?? "").replace(/[&<>"']/g, function(char) {

                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[char];

            });

        }


        // =========================================
        // 4. ตรวจสอบ URL
        // =========================================

        function safeUrl(value) {

            try {

                const url = new URL(value);

                if (url.protocol === "https:" || url.protocol === "http:") {
                    return url.href;
                }

            } catch (error) {

                return "";

            }

            return "";

        }


        // =========================================
        // 5. แปลงรูปเป็น Base64
        // =========================================

        function getBase64(file) {

            return new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);

                reader.onerror = () => reject(
                    new Error("ไม่สามารถอ่านไฟล์รูปภาพได้")
                );

                reader.readAsDataURL(file);

            });

        }


        // =========================================
        // 6. ตรวจสอบสถานะ Firebase
        // =========================================

        onValue(
            ref(db, ".info/connected"),

            (snapshot) => {

                isConnected = snapshot.val() === true;

                if (isConnected) {

                    loadingOverlay.classList.add("hidden-section");

                } else {

                    loadingText.textContent =
                        "กำลังเชื่อมต่อฐานข้อมูลใหม่...";

                    loadingOverlay.classList.remove("hidden-section");

                }

            },

            (error) => {

                console.error("Connection Error:", error);

                loadingText.textContent =
                    "ไม่สามารถเชื่อมต่อ Firebase ได้";

            }

        );


        // =========================================
        // 7. อัปโหลดข้อมูล
        // =========================================

        modForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!isConnected) {

                alert("ยังไม่ได้เชื่อมต่อ Firebase");

                return;

            }

            submitBtn.disabled = true;

            submitBtn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด...';

            try {

                const uploader =
                    document.getElementById("modUploader").value.trim();

                const name =
                    document.getElementById("modName").value.trim();

                const monster =
                    document.getElementById("modMonster").value.trim();

                const version =
                    document.getElementById("modVersion").value.trim();

                const link =
                    safeUrl(document.getElementById("modLink").value.trim());

                const desc =
                    document.getElementById("modDesc").value.trim();

                const imgUrl =
                    safeUrl(document.getElementById("modImgUrl").value.trim());

                const imgFile =
                    document.getElementById("modImgFile").files[0];


                // ตรวจสอบลิงก์ดาวน์โหลด

                if (!link) {

                    throw new Error("กรุณาใส่ลิงก์ดาวน์โหลดที่ถูกต้อง");

                }


                // รูปภาพเริ่มต้น

                let finalImage =
                    "https://placehold.co/600x400/0f172a/06b6d4?text=Mod+Hub";


                // ถ้ามีไฟล์รูปภาพ

                if (imgFile) {

                    if (!imgFile.type.startsWith("image/")) {

                        throw new Error("ไฟล์ที่เลือกไม่ใช่รูปภาพ");

                    }

                    if (imgFile.size > 500 * 1024) {

                        throw new Error("รูปภาพต้องมีขนาดไม่เกิน 500 KB");

                    }

                    finalImage = await getBase64(imgFile);

                } else if (imgUrl) {

                    finalImage = imgUrl;

                }


                // เวลาปัจจุบัน

                const now = new Date();

                const timeString =
                    now.toLocaleTimeString("th-TH", {
                        hour: "2-digit",
                        minute: "2-digit"
                    })
                    + " | "
                    + now.toLocaleDateString("th-TH");


                // ข้อมูลที่จะบันทึก

                const modData = {

                    name,

                    monster,

                    version,

                    link,

                    desc,

                    image: finalImage,

                    uploader,

                    time: timeString,

                    timestamp: Date.now()

                };


                // บันทึกข้อมูลลง Firebase

                const modsRef = ref(db, "mods");

                const newModRef = push(modsRef);

                await set(newModRef, modData);


                // ล้างฟอร์ม

                document.getElementById("modName").value = "";

                document.getElementById("modMonster").value = "";

                document.getElementById("modVersion").value = "";

                document.getElementById("modLink").value = "";

                document.getElementById("modDesc").value = "";

                document.getElementById("modImgUrl").value = "";

                document.getElementById("modImgFile").value = "";


                alert("อัปโหลดข้อมูลสำเร็จ!");

            } catch (error) {

                console.error("Upload Error:", error);

                alert("เกิดข้อผิดพลาด: " + error.message);

            } finally {

                submitBtn.disabled = false;

                submitBtn.innerHTML =
                    '<i class="fa-solid fa-satellite-dish"></i> อัปโหลดข้อมูล';

            }

        });


        // =========================================
        // 8. ดึงข้อมูล Realtime
        // =========================================

        function startListeningMods() {

            const modsRef = ref(db, "mods");

            onValue(

                modsRef,

                (snapshot) => {

                    modContainer.innerHTML = "";

                    if (!snapshot.exists()) {

                        modCount.textContent = "0 รายการ";

                        modContainer.innerHTML = `
                            <div class="col-span-full glass-effect p-12
                                        rounded-2xl text-center text-gray-500">

                                <i class="fa-solid fa-wifi text-4xl mb-3 block"></i>

                                ระบบออนไลน์พร้อมใช้งาน
                                เริ่มเพิ่มข้อมูลรายการแรกได้ทันที!

                            </div>
                        `;

                        return;

                    }


                    const data = snapshot.val();


                    // เรียงตามเวลาใหม่สุดก่อน

                    const modsList = Object.entries(data)
                        .map(([id, mod]) => ({
                            id,
                            ...mod
                        }))
                        .sort((a, b) =>
                            (b.timestamp || 0) - (a.timestamp || 0)
                        );


                    modCount.textContent =
                        `${modsList.length} รายการ`;


                    // สร้างการ์ด

                    modsList.forEach((mod) => {

                        const card = document.createElement("div");

                        card.className =
                            "glass-effect rounded-2xl overflow-hidden " +
                            "shadow-xl glow-card flex flex-col justify-between";


                        const image = safeUrl(mod.image) ||
                            "https://placehold.co/600x400/0f172a/06b6d4?text=Mod+Hub";

                        const downloadLink = safeUrl(mod.link);


                        card.innerHTML = `

                            <div>

                                <div class="h-44 w-full bg-cover bg-center
                                            border-b border-slate-800 relative"
                                     style="background-image: url('${escapeHtml(image)}');">

                                    <span class="absolute top-3 left-3
                                                 bg-slate-950/80 text-cyan-400
                                                 text-xs px-2.5 py-1 rounded-md
                                                 border border-cyan-500/20">

                                        <i class="fa-solid fa-cube mr-1"></i>

                                        ${escapeHtml(mod.monster)}

                                    </span>

                                    <span class="absolute bottom-3 right-3
                                                 bg-cyan-600 text-white
                                                 text-[10px] font-bold px-2 py-0.5
                                                 rounded-full">

                                        ${escapeHtml(mod.version)}

                                    </span>

                                </div>


                                <div class="p-4">

                                    <h3 class="text-base font-bold text-white mb-1
                                               line-clamp-1">

                                        ${escapeHtml(mod.name)}

                                    </h3>


                                    <div class="text-[11px] text-gray-400 mb-3
                                                flex justify-between gap-2">

                                        <span>

                                            แชร์โดย:

                                            <span class="text-cyan-400">

                                                ${escapeHtml(mod.uploader)}

                                            </span>

                                        </span>

                                        <span>

                                            <i class="fa-regular fa-clock"></i>

                                            ${escapeHtml(mod.time)}

                                        </span>

                                    </div>


                                    <p class="text-xs text-gray-400 bg-slate-950/40
                                              p-2.5 rounded-lg border
                                              border-slate-900/60 line-clamp-3">

                                        ${escapeHtml(mod.desc)}

                                    </p>

                                </div>

                            </div>


                            <div class="p-4 pt-0">

                                ${
                                    downloadLink
                                    ?
                                    `<a href="${escapeHtml(downloadLink)}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="w-full bg-gradient-to-r
                                               from-cyan-600 to-indigo-600
                                               hover:from-cyan-500
                                               hover:to-indigo-500
                                               text-white text-xs font-semibold
                                               py-2 rounded-xl flex items-center
                                               justify-center gap-1">

                                        <i class="fa-solid fa-download"></i>

                                        ดาวน์โหลดไฟล์

                                    </a>`
                                    :
                                    `<span class="text-gray-500 text-xs">
                                        ไม่มีลิงก์ดาวน์โหลด
                                    </span>`
                                }

                            </div>

                        `;


                        modContainer.appendChild(card);

                    });

                },

                (error) => {

                    console.error("Realtime Error:", error);

                    modContainer.innerHTML = `
                        <div class="col-span-full glass-effect p-8
                                    rounded-2xl text-center text-red-400">

                            <i class="fa-solid fa-triangle-exclamation"></i>

                            ไม่สามารถอ่านข้อมูลจาก Firebase ได้

                            <p class="text-xs mt-2 text-gray-500">
                                ${escapeHtml(error.message)}
                            </p>

                        </div>
                    `;

                }

            );

        }


        // เริ่มรับข้อมูล

        startListeningMods();

    </script>

</body>
</html>
