<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLOBAL NEXUS: PRO-GAME MATRIX</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Prompt', sans-serif;
            background: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-cyan {
            box-shadow:
                0 0 15px rgba(6, 182, 212, 0.5),
                inset 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .neon-glow-magenta {
            box-shadow:
                0 0 20px rgba(236, 72, 153, 0.6);
        }

        .scanlines {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%
                );

            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .cyber-grid {
            background-image:
                linear-gradient(
                    to right,
                    rgba(31, 41, 55, 0.5) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    to bottom,
                    rgba(31, 41, 55, 0.5) 1px,
                    transparent 1px
                );

            background-size: 4rem 4rem;

            mask-image:
                radial-gradient(
                    ellipse 60% 50% at 50% 0%,
                    #000 70%,
                    transparent 100%
                );
        }

        @keyframes pulse-fast {
            0%, 100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.9;
            }
        }

        .animate-pulse-fast {
            animation: pulse-fast 1.5s infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .scan-effect {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(34, 211, 238, 0.8);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.9);
            animation: scan 1.2s linear infinite;
        }

        .game-card {
            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        .game-card:hover {
            transform: translateY(-7px);
        }

        .modal-backdrop {
            backdrop-filter: blur(8px);
        }
    </style>
</head>

                        platform: 'IOS',

                        obfuscated_name:
                            'RACING TURBO EXPERIENCE',

                        obfuscated_desc:
                            'เกมแข่งรถความเร็วสูงพร้อมรถหลายประเภท',

                        obfuscated_cover:
                            'https://placehold.co/1200x700/111827/22d3ee?text=ENCRYPTED+IOS',

                        real_name:
                            'Turbo Racing',

                        real_desc:
                            'เกมแข่งรถสำหรับอุปกรณ์ iOS',

                        real_cover:
                            'https://placehold.co/1200x700/111827/ef4444?text=TURBO+RACING',

                        sandbox_status:
                            'CLEAN',

                        sandbox_score:
                            'VERIFIED',

                        decrypted:
                            false,

                        downloading:
                            false,

                        status_text:
                            ''

                    }

                ],

                get filteredGames() {

                    const query =
                        this.searchQuery
                            .trim()
                            .toLowerCase();

                    return this.games.filter(game => {

                        const searchText = [

                            game.obfuscated_name,

                            game.obfuscated_desc,

                            game.real_name,

                            game.real_desc,

                            game.platform

                        ]
                        .join(' ')
                        .toLowerCase();

                        const matchSearch =
                            query === '' ||
                            searchText.includes(query);

                        const matchPlatform =
                            this.activePlatform === 'ALL' ||
                            game.platform === this.activePlatform;

                        return matchSearch && matchPlatform;

                    });

                },

                executeDecryptionMatrix(game) {

                    if (game.downloading) {
                        return;
                    }

                    if (!game.decrypted) {

                        game.downloading = true;

                        game.status_text =
                            'DECRYPTING...';

                        setTimeout(() => {

                            game.decrypted = true;

                            game.downloading = false;

                            game.status_text = '';

                        }, 1200);

                        return;
                    }

                    this.selectedGame = game;

                }

            };

        }
    </script>
