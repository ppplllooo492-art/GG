
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Realtime Mod Hub v7.0</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #060811, #0b1120);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-effect {
            background: rgba(255,255,255,.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.08);
        }

        .glow-card {
            transition: all .2s ease;
        }

        .glow-card:hover {
            box-shadow: 0 0 30px rgba(6,182,212,.25);
            transform: translateY(-4px);
        }
    </style>
</head>

<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">

    <header class="text-center my-6">
        <h1 class="text-3xl md:text-5xl font-bold text-cyan-400">
            <i class="fa-solid fa-bolt"></i>
            GLOBAL REALTIME HUB
        </h1>

        <p class="text-gray-400 text-sm mt-2">
            คลังจัดเก็บข้อมูล Mod ออนไลน์แบบเรียลไทม์
        </p>

        <p id="connectionStatus" class="text-yellow-400 text-sm mt-3">
            กำลังเชื่อมต่อ Firebase...
        </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- ฟอร์มอัปโหลด -->
        <section>
            <div class="glass-effect p-6 rounded-2xl">

                <h2 class="text-lg font-semibold text-cyan-400 mb-4">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    ฝากข้อมูล Mod
                </h2>

                <form id="modForm" class="space-y-4">

                    <input id="modUploader"
                           required maxlength="60"
                           placeholder="ชื่อผู้แชร์"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <input id="modName"
                           required maxlength="100"
                           placeholder="ชื่อ Mod / เกม"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <input id="modMonster"
                           required maxlength="100"
                           placeholder="มอนสเตอร์ / ตัวละคร"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <input id="modVersion"
                           required maxlength="30"
                           placeholder="เวอร์ชัน v1.0.0"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <input id="modImgFile"
                           type="file"
                           accept="image/*"
                           class="w-full text-sm">

                    <input id="modImgUrl"
                           type="url"
                           placeholder="URL รูปภาพ (ถ้ามี)"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <input id="modLink"
                           type="url"
                           required
                           placeholder="ลิงก์ดาวน์โหลด"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm">

                    <textarea id="modDesc"
                              required maxlength="2000"
                              rows="4"
                              placeholder="รายละเอียด Mod"
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm"></textarea>

                    <button id="submitBtn"
                            type="submit"
                            class="w-full bg-cyan-600 hover:bg-cyan-500 rounded-lg p-3 font-semibold">
                        <i class="fa-solid fa-upload"></i>
                        อัปโหลดข้อมูล
                    </button>

                </form>
            </div>
        </section>

        <!-- รายการ Mod -->
        <section class="lg:col-span-2">

            <div class="flex justify-between items-center mb-4">

                <h2 class="text-lg text-cyan-400 font-semibold">
                    <i class="fa-solid fa-earth-americas"></i>
                    Realtime Cloud Feed
                </h2>

                <span id="modCount"
                      class="bg-slate-800 text-cyan-400 px-3 py-1 rounded-full text-sm">
                    0 รายการ
                </span>

            </div>

            <div id="modContainer"
                 class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div class="glass-effect p-8 rounded-xl text-center text-gray-400">
                    กำลังโหลดข้อมูล...
                </div>

            </div>

        </section>

    </div>
</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    onDisconnect,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


/* =========================================
   Firebase Configuration
   ใส่ค่าจริงจาก Firebase Console
========================================= */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",

    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/* =========================================
   เริ่มต้น Firebase
========================================= */

const connectionStatus =
    document.getElementById("connectionStatus");

const modContainer =
    document.getElementById("modContainer");

const modCount =
    document.getElementById("modCount");

const submitBtn =
    document.getElementById("submitBtn");

let db;

try {

    const app = initializeApp(firebaseConfig);

    db = getDatabase(app);

} catch (error) {

    console.error("Firebase initialization:", error);

    connectionStatus.textContent =
        "❌ Firebase Configuration ไม่ถูกต้อง";

    connectionStatus.className =
        "text-red-400 text-sm mt-3";

}


/* =========================================
   ตรวจสอบสถานะเชื่อมต่อ
========================================= */

if (db) {

    const connectedRef = ref(db, ".info/connected");

    onValue(connectedRef, async (snapshot) => {

        if (snapshot.val() === true) {

            connectionStatus.textContent =
                "🟢 เชื่อมต่อ Firebase สำเร็จ";

            connectionStatus.className =
                "text-green-400 text-sm mt-3";

        } else {

            connectionStatus.textContent =
                "🔴 กำลังเชื่อมต่อฐานข้อมูลใหม่...";

            connectionStatus.className =
                "text-yellow-400 text-sm mt-3";

        }

    });

}


/* =========================================
   Escape HTML ป้องกัน XSS
========================================= */

function escapeHtml(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        (char) => {

            const entities = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"

            };

            return entities[char];

        }
    );

}


/* =========================================
   ตรวจสอบ URL
========================================= */

function safeUrl(value) {

    try {

        const url = new URL(value);

        if (
            url.protocol === "https:" ||
            url.protocol === "http:"
        ) {

            return url.href;

        }

    } catch (error) {}

    return "";

}


/* =========================================
   แปลงภาพเป็น Base64
========================================= */

function getBase64(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(file);

    });

}


/* =========================================
   รับข้อมูล Realtime
========================================= */

function startListeningMods() {

    if (!db) return;

    const modsRef = ref(db, "mods");

    onValue(
        modsRef,

        (snapshot) => {

            modContainer.innerHTML = "";

            if (!snapshot.exists()) {

                modCount.textContent = "0 รายการ";

                modContainer.innerHTML = `
                    <div class="col-span-full glass-effect p-10 rounded-xl text-center text-gray-400">
                        <i class="fa-solid fa-wifi text-4xl mb-3"></i>
                        <p>ยังไม่มีข้อมูล Mod</p>
                        <p class="text-sm mt-2">เริ่มแชร์ข้อมูลเป็นคนแรกได้เลย</p>
                    </div>
                `;

                return;

            }

            const mods = Object.entries(snapshot.val())
                .map(([id, mod]) => ({
                    id,
                    ...mod
                }))
                .sort((a, b) =>
                    (b.createdAt || 0) - (a.createdAt || 0)
                );

            modCount.textContent =
                `${mods.length} รายการ`;

            mods.forEach((mod) => {

                const card = document.createElement("div");

                card.className =
                    "glass-effect rounded-2xl overflow-hidden glow-card flex flex-col justify-between";

                const imageUrl =
                    safeUrl(mod.image || "");

                const downloadUrl =
                    safeUrl(mod.link || "");

                const imageHtml = imageUrl
                    ? `
                        <img
                            src="${escapeHtml(imageUrl)}"
                            alt="Mod image"
                            loading="lazy"
                            class="h-44 w-full object-cover"
                        >
                    `
                    : `
                        <div class="h-44 bg-slate-900 flex items-center justify-center">
                            <i class="fa-solid fa-gamepad text-4xl text-cyan-400"></i>
                        </div>
                    `;

                card.innerHTML = `

                    <div>

                        <div class="relative">

                            ${imageHtml}

                            <span class="absolute top-3 left-3 bg-slate-950/90 text-cyan-400 text-xs px-3 py-1 rounded-md">

                                ${escapeHtml(mod.monster)}

                            </span>

                            <span class="absolute bottom-3 right-3 bg-cyan-600 text-white text-xs px-2 py-1 rounded-full">

                                ${escapeHtml(mod.version)}

                            </span>

                        </div>

                        <div class="p-4">

                            <h3 class="font-bold text-white mb-2">

                                ${escapeHtml(mod.name)}

                            </h3>

                            <div class="text-xs text-gray-400 mb-3">

                                ผู้แชร์:
                                <span class="text-cyan-400">

                                    ${escapeHtml(mod.uploader)}

                                </span>

                            </div>

                            <p class="text-xs text-gray-400 bg-slate-950/50 p-3 rounded-lg whitespace-pre-wrap break-words">

                                ${escapeHtml(mod.desc)}

                            </p>

                        </div>

                    </div>

                    <div class="p-4 pt-0">

                        ${
                            downloadUrl
                            ? `
                                <a
                                    href="${escapeHtml(downloadUrl)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="block text-center bg-cyan-600 hover:bg-cyan-500 p-3 rounded-lg text-sm font-semibold"
                                >

                                    <i class="fa-solid fa-download"></i>
                                    ดาวน์โหลด

                                </a>
                            `
                            : `
                                <p class="text-red-400 text-xs">
                                    ลิงก์ดาวน์โหลดไม่ถูกต้อง
                                </p>
                            `
                        }

                    </div>

                `;

                modContainer.appendChild(card);

            });

        },

        (error) => {

            console.error("Realtime Database:", error);

            connectionStatus.textContent =
                "❌ อ่านข้อมูลไม่ได้: " + error.message;

            connectionStatus.className =
                "text-red-400 text-sm mt-3";

        }

    );

}


if (db) {

    startListeningMods();

}


/* =========================================
   ส่งข้อมูลขึ้น Firebase
========================================= */

document.getElementById("modForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        if (!db) {

            alert("Firebase ยังไม่พร้อมใช้งาน");

            return;

        }

        submitBtn.disabled = true;

        submitBtn.textContent =
            "กำลังอัปโหลด...";

        try {

            const uploader =
                document.getElementById("modUploader")
                    .value.trim();

            const name =
                document.getElementById("modName")
                    .value.trim();

            const monster =
                document.getElementById("modMonster")
                    .value.trim();

            const version =
                document.getElementById("modVersion")
                    .value.trim();

            const link =
                safeUrl(
                    document.getElementById("modLink")
                        .value.trim()
                );

            const desc =
                document.getElementById("modDesc")
                    .value.trim();

            const imgUrl =
                document.getElementById("modImgUrl")
                    .value.trim();

            const imgFile =
                document.getElementById("modImgFile")
                    .files[0];

            if (!link) {

                throw new Error(
                    "ลิงก์ดาวน์โหลดต้องเป็น HTTP หรือ HTTPS"
                );

            }

            let finalImage = "";

            if (imgFile) {

                if (!imgFile.type.startsWith("image/")) {

                    throw new Error(
                        "ไฟล์ที่เลือกไม่ใช่รูปภาพ"
                    );

                }

                if (imgFile.size > 500 * 1024) {

                    throw new Error(
                        "รูปภาพต้องมีขนาดไม่เกิน 500 KB"
                    );

                }

                finalImage = await getBase64(imgFile);

            } else if (imgUrl) {

                finalImage = safeUrl(imgUrl);

                if (!finalImage) {

                    throw new Error(
                        "URL รูปภาพไม่ถูกต้อง"
                    );

                }

            }

            const modData = {

                uploader,
                name,
                monster,
                version,
                link,
                desc,
                image: finalImage,

                createdAt: serverTimestamp()

            };

            const modsRef = ref(db, "mods");

            const newModRef = push(modsRef);

            await set(newModRef, modData);

            document.getElementById("modForm").reset();

            alert(
                "🚀 อัปโหลดข้อมูลสำเร็จ!"
            );

        } catch (error) {

            console.error("Upload error:", error);

            alert(
                "❌ อัปโหลดไม่สำเร็จ\n" +
                error.message
            );

        } finally {

            submitBtn.disabled = false;

            submitBtn.innerHTML =
                '<i class="fa-solid fa-upload"></i> อัปโหลดข้อมูล';

        }

    });

</script>

</body>
</html>
